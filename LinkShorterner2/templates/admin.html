<!DOCTYPE html>
<html>
<head><title>Admin Page</title>
<style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 40px;
      background-color: #f5f7fa;
      color: #333;
    }

    h2 {
      color: #2c3e50;
      margin-bottom: 20px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      background-color: #fff;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
    }

    th, td {
      text-align: left;
      padding: 12px 15px;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: #3498db;
      color: white;
    }

    tr:hover {
      background-color: #f1f1f1;
    }

    a {
      color: #3498db;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: #2c3e50;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <h2>📋 Daftar Semua Short URL</h2>
  <table border="1" cellpadding="5">
    <tr>
      <th>Shortcode</th>
      <th>Long URL</th>
      <th>Aksi</th>
    </tr>
    {% for row in data %}
  <tr>
    <td>sphplg.click/{{ row.code }}</td>
    <td>{{ row.long_url }}</td>
    <td>
      <a href="/edit/{{ row.code }}">Edit</a> |
      <a href="/delete/{{ row.code }}">Delete</a>
    </td>
  </tr>
{% endfor %}

  </table>
  <br>
  <a href="/posturl">← Kembali ke halaman utama</a>
</body>
</html>
