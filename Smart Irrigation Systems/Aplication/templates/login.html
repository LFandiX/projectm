<!DOCTYPE html>
<html>
<head>
    <title>Login - Smart Irrigation System</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #e0f7fa; margin: 0; }
        .login-container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        h2 { color: #00695c; margin-bottom: 20px; }
        input { display: block; margin: 15px 0; padding: 12px; width: 100%; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
        button { width: 100%; padding: 12px; background-color: #00695c; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; transition: 0.3s; }
        button:hover { background-color: #004d40; }
        .error { color: #d32f2f; background-color: #ffcdd2; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-size: 14px; }
        .footer { margin-top: 20px; font-size: 12px; color: #777; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Smart Garden Login</h2>
        
        <!-- Menampilkan Pesan Error -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="error">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Masuk Dashboard</button>
        </form>
        <div class="footer">Secure Irrigation Control Panel</div>
    </div>
</body>
</html>
