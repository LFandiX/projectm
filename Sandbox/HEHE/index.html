<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Love Journey ❤️</title>
<style>
    body {
        background: linear-gradient(to right, #ff758c, #ff7eb3);
        font-family: 'Segoe UI', sans-serif;
        color: #fff;
        text-align: center;
        overflow: hidden;
        transition: background 1s ease-in-out;
    }
    h1 {
        font-size: 3em;
        margin-top: 50px;
    }
    #message {
        font-size: 1.6em;
        margin: 30px auto;
        max-width: 80%;
        min-height: 80px;
    }
    button {
        padding: 15px 30px;
        background: #ff4d6d;
        border: none;
        color: white;
        border-radius: 25px;
        font-size: 1.3em;
        cursor: pointer;
        transition: transform 0.3s;
        margin-top: 20px;
    }
    button:hover { transform: scale(1.1); }
    .heart {
        position: absolute;
        color: #fff;
        font-size: 20px;
        animation: fall 5s linear infinite;
    }
    @keyframes fall {
        0% {transform: translateY(-10vh);}
        100% {transform: translateY(100vh);}
    }
    #popup {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.8);
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        color: white;
        text-align: center;
    }
    #popup img {
        width: 200px;
        border-radius: 50%;
        margin-bottom: 20px;
        border: 5px solid white;
    }
</style>
</head>
<body>

<h1>Hai Sayangku ❤️</h1>
<div id="message">Aku mau ajak kamu jalan-jalan ke perjalanan cinta kita 💕</div>
<button onclick="nextStep()">Mulai 💌</button>

<div id="popup">
    <img src="https://placekitten.com/300/300" alt="Foto Kita">
    <h2>Selamanya kita berdua ❤️</h2>
    <p>Aku sayang kamu lebih dari apapun! 😘</p>
    <button onclick="closePopup()">Aku Sayang Kamu 💖</button>
</div>

<audio id="bgMusic" autoplay loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" type="audio/mpeg">
</audio>

<script>
    const messages = [
        "Setiap hari sama kamu itu berharga banget 😍",
        "Aku selalu bersyukur punya pacar sebaik kamu 💖",
        "Kamu bikin hidupku lebih indah ✨",
        "Aku janji bakal terus jaga kamu 💍",
        "Dan… aku cuma mau bilang satu hal terakhir…"
    ];
    let index = 0;

    function nextStep() {
        if(index < messages.length){
            typeEffect(messages[index]);
            index++;
        } else {
            document.getElementById('popup').style.display = 'flex';
        }
    }

    function typeEffect(text) {
        const msgDiv = document.getElementById('message');
        msgDiv.innerHTML = "";
        let i = 0;
        const interval = setInterval(() => {
            msgDiv.innerHTML += text.charAt(i);
            i++;
            if(i === text.length) clearInterval(interval);
        }, 80);
    }

    function createHeart(){
        const heart = document.createElement('div');
        heart.classList.add('heart');
        heart.innerHTML = '💗';
        heart.style.left = Math.random() * window.innerWidth + 'px';
        heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
        document.body.appendChild(heart);
        setTimeout(()=> heart.remove(), 5000);
    }
    setInterval(createHeart, 300);

    function closePopup(){
        document.getElementById('popup').style.display = 'none';
    }
</script>

</body>
</html>
