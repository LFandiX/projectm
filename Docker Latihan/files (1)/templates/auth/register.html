{% extends "base.html" %}
{% block title %}Daftar — NexDrive{% endblock %}
{% block body %}
<div class="auth-wrap">
  <div class="auth-bg">
    <div class="auth-orb auth-orb-1"></div>
    <div class="auth-orb auth-orb-2"></div>
    <div class="auth-orb auth-orb-3"></div>
  </div>
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon"><i class="fa fa-cloud-upload-alt"></i></div>
      <div class="logo-text">Nex<span>Drive</span></div>
    </div>
    <h1 class="auth-title">Buat Akun</h1>
    <p class="auth-sub">Mulai simpan dan bagikan file Anda</p>
    <form method="POST" class="auth-form">
      <div class="form-group">
        <label><i class="fa fa-user"></i> Username</label>
        <input type="text" name="username" required placeholder="username_anda" value="{{ username or '' }}" autocomplete="username">
      </div>
      <div class="form-group">
        <label><i class="fa fa-envelope"></i> Email</label>
        <input type="email" name="email" required placeholder="nama@email.com" value="{{ email or '' }}" autocomplete="email">
      </div>
      <div class="form-group">
        <label><i class="fa fa-lock"></i> Password</label>
        <div class="input-wrap">
          <input type="password" name="password" id="regPass" required placeholder="Min. 8 karakter" autocomplete="new-password">
          <button type="button" class="toggle-pw" onclick="togglePw('regPass',this)"><i class="fa fa-eye"></i></button>
        </div>
      </div>
      <div class="form-group">
        <label><i class="fa fa-check-circle"></i> Konfirmasi Password</label>
        <div class="input-wrap">
          <input type="password" name="confirm_password" id="regPass2" required placeholder="Ulangi password" autocomplete="new-password">
          <button type="button" class="toggle-pw" onclick="togglePw('regPass2',this)"><i class="fa fa-eye"></i></button>
        </div>
      </div>
      <button type="submit" class="btn-primary btn-full">
        <i class="fa fa-user-plus"></i> Buat Akun
      </button>
    </form>
    <p class="auth-switch">Sudah punya akun? <a href="{{ url_for('auth.login') }}">Login</a></p>
  </div>
</div>
{% endblock %}
