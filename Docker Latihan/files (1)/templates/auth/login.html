{% extends "base.html" %}
{% block title %}Login — NexDrive{% endblock %}
{% block body %}
<div class="auth-wrap">
  <div class="auth-bg">
    <div class="auth-orb auth-orb-1"></div>
    <div class="auth-orb auth-orb-2"></div>
    <div class="auth-orb auth-orb-3"></div>
  </div>
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon"><i class="fa fa-cloud-upload-alt"></i></div>
      <div class="logo-text">Nex<span>Drive</span></div>
    </div>
    <h1 class="auth-title">Selamat Datang</h1>
    <p class="auth-sub">Masuk ke akun Anda untuk melanjutkan</p>
    <form method="POST" class="auth-form">
      <div class="form-group">
        <label><i class="fa fa-envelope"></i> Email</label>
        <input type="email" name="email" required placeholder="nama@email.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label><i class="fa fa-lock"></i> Password</label>
        <div class="input-wrap">
          <input type="password" name="password" id="loginPass" required placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="toggle-pw" onclick="togglePw('loginPass',this)"><i class="fa fa-eye"></i></button>
        </div>
      </div>
      <button type="submit" class="btn-primary btn-full">
        <i class="fa fa-sign-in-alt"></i> Masuk
      </button>
    </form>
    <p class="auth-switch">Belum punya akun? <a href="{{ url_for('auth.register') }}">Daftar sekarang</a></p>
  </div>
</div>
{% endblock %}
