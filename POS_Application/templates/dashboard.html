{% extends "layout.html" %}

{% block content %}
<h2 class="font-weight-bold mb-4">Dashboard Laporan</h2>

<div class="row">
    <div class="col-md-4 mb-4">
        <div class="card border-0 shadow-sm bg-primary text-white">
            <div class="card-body">
                <div class="d-flex justify-content-between">
                    <div>
                        <h6 class="text-uppercase small">Omzet Hari Ini</h6>
                        <h3 class="font-weight-bold">Rp {{ "{:,.0f}".format(omzet) }}</h3>
                    </div>
                    <i class="fas fa-chart-line fa-3x opacity-50"></i>
                </div>
            </div>
        </div>
    </div>

    <div class="col-md-4 mb-4">
        <div class="card border-0 shadow-sm bg-success text-white">
            <div class="card-body">
                <div class="d-flex justify-content-between">
                    <div>
                        <h6 class="text-uppercase small">Transaksi Hari Ini</h6>
                        <h3 class="font-weight-bold">{{ transaksi }} Nota</h3>
                    </div>
                    <i class="fas fa-shopping-cart fa-3x opacity-50"></i>
                </div>
            </div>
        </div>
    </div>

    <div class="col-md-4 mb-4">
        <div class="card border-0 shadow-sm bg-warning text-white">
            <div class="card-body">
                <div class="d-flex justify-content-between">
                    <div>
                        <h6 class="text-uppercase small">Stok Hampir Habis</h6>
                        <h3 class="font-weight-bold">{{ low_stock }} Produk</h3>
                    </div>
                    <i class="fas fa-exclamation-triangle fa-3x opacity-50"></i>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-md-12">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white font-weight-bold">
                Tren Penjualan (7 Hari Terakhir)
            </div>
            <div class="card-body">
                <canvas id="salesChart" height="100"></canvas>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const ctx = document.getElementById('salesChart').getContext('2d');
    const chartData = {{ chart_data | tojson }};
    
    // Balik urutan agar tanggal paling lama di kiri
    chartData.reverse();

    new Chart(ctx, {
        type: 'line',
        data: {
            labels: chartData.map(d => d.tgl),
            datasets: [{
                label: 'Omzet Penjualan (Rp)',
                data: chartData.map(d => d.total),
                borderColor: '#007bff',
                backgroundColor: 'rgba(0, 123, 255, 0.1)',
                fill: true,
                tension: 0.3
            }]
        },
        options: {
            scales: {
                y: { beginAtZero: true }
            }
        }
    });
</script>
{% endblock %}
