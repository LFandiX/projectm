{% extends "layout.html" %}

{% block content %}
<div class="row">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white font-weight-bold">
                <i class="fas fa-file-export mr-2"></i>Export Laporan Penjualan (Excel)
            </div>
            <div class="card-body">
                <form action="/reports/export" method="POST">
                    <div class="row">
                        <div class="col-6">
                            <label>Bulan</label>
                            <select name="month" class="form-control" required>
                                {% for m in range(1, 13) %}
                                <option value="{{ '%02d' % m }}">{{ '%02d' % m }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-6">
                            <label>Tahun</label>
                            <input type="number" name="year" class="form-control" value="2026" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success btn-block mt-3">
                        <i class="fas fa-download mr-2"></i>Download Laporan
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white font-weight-bold">
                <i class="fas fa-database mr-2"></i>Database Backup
            </div>
            <div class="card-body">
                <a href="/settings/backup" class="btn btn-primary btn-block mb-3">
                    <i class="fas fa-save mr-2"></i>Buat Cadangan Baru (.sql)
                </a>
                <label class="small font-weight-bold text-muted text-uppercase">File Backup Tersedia:</label>
                <ul class="list-group">
                    {% for file in files %}
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        {{ file }}
                        <span class="badge badge-secondary badge-pill">SQL</span>
                    </li>
                    {% else %}
                    <li class="list-group-item text-center text-muted">Belum ada file cadangan.</li>
                    {% endfor %}
                </ul>
            </div>
        </div>
    </div>
</div>
{% endblock %}
